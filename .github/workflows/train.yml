# Dispatch a training batch. One job per seed per segment.
#
# A job is capped at 6 h. Runs that need longer are chained across sequential
# segments that hand a checkpoint over through the Actions cache; a segment whose
# predecessor already finished short-circuits in seconds.
#
#   CartPole-V  ~1 h   -> 1 segment
#   Pendulum-V  6.5-14.7 h (runner speed varies ~2x) -> 3 segments
name: train

run-name: "${{ inputs.config }} · seeds ${{ inputs.seeds }}"

on:
  workflow_dispatch:
    inputs:
      config:
        description: "config yml, relative to repo root"
        required: true
        default: configs/pomdp/cartpole/v/rnn.yml
      seeds:
        description: "JSON list of seeds, e.g. [73] or [73,1,2,3,4]"
        required: true
        default: "[73]"
      extra_flags:
        description: 'extra CLI flags, e.g. "--algo sac"'
        required: false
        default: ""
      segments:
        description: "chain length (1-4). Pendulum-V needs 3; CartPole-V needs 1"
        required: false
        default: "1"
      train_timeout_minutes:
        description: "per-segment training cap. 320 in production; set small to test chaining"
        required: false
        default: "320"
      ckpt_minutes:
        description: "minutes between checkpoints. Must be well under train_timeout_minutes, since a timed-out step is killed and only periodic checkpoints survive"
        required: false
        default: "20"

permissions:
  contents: read
  issues: write

jobs:
  seg1:
    uses: ./.github/workflows/train-segment.yml
    with:
      config: ${{ inputs.config }}
      seeds: ${{ inputs.seeds }}
      extra_flags: ${{ inputs.extra_flags }}
      segment: 1
      train_timeout_minutes: ${{ fromJSON(inputs.train_timeout_minutes) }}
      ckpt_minutes: ${{ fromJSON(inputs.ckpt_minutes) }}

  seg2:
    needs: seg1
    if: always() && fromJSON(inputs.segments) >= 2
    uses: ./.github/workflows/train-segment.yml
    with:
      config: ${{ inputs.config }}
      seeds: ${{ inputs.seeds }}
      extra_flags: ${{ inputs.extra_flags }}
      segment: 2
      train_timeout_minutes: ${{ fromJSON(inputs.train_timeout_minutes) }}
      ckpt_minutes: ${{ fromJSON(inputs.ckpt_minutes) }}

  seg3:
    needs: seg2
    if: always() && fromJSON(inputs.segments) >= 3
    uses: ./.github/workflows/train-segment.yml
    with:
      config: ${{ inputs.config }}
      seeds: ${{ inputs.seeds }}
      extra_flags: ${{ inputs.extra_flags }}
      segment: 3
      train_timeout_minutes: ${{ fromJSON(inputs.train_timeout_minutes) }}
      ckpt_minutes: ${{ fromJSON(inputs.ckpt_minutes) }}

  seg4:
    needs: seg3
    if: always() && fromJSON(inputs.segments) >= 4
    uses: ./.github/workflows/train-segment.yml
    with:
      config: ${{ inputs.config }}
      seeds: ${{ inputs.seeds }}
      extra_flags: ${{ inputs.extra_flags }}
      segment: 4
      train_timeout_minutes: ${{ fromJSON(inputs.train_timeout_minutes) }}
      ckpt_minutes: ${{ fromJSON(inputs.ckpt_minutes) }}

  summary:
    name: batch summary
    needs: [seg1, seg2, seg3, seg4]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build batch report
        id: report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          jobs_txt=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
                       --paginate -q '.jobs[] | select(.name|contains("· seed")) | "\(.name)|\(.conclusion)"')
          ok=$(printf '%s\n' "$jobs_txt" | grep -c 'success' || true)
          bad=$(printf '%s\n' "$jobs_txt" | grep -vc 'success' || true)
          {
            echo "**Config:** \`${{ inputs.config }}\`"
            echo "**Seeds:** \`${{ inputs.seeds }}\`  ·  **Segments:** \`${{ inputs.segments }}\`"
            echo "**Jobs:** $ok succeeded, $bad did not"
            echo
            echo "A segment that times out is expected: it saves a checkpoint and the"
            echo "next segment resumes from it. Look for the COMPLETE notice to know a"
            echo "seed actually finished."
            echo
            echo "| job | conclusion |"
            echo "|---|---|"
            printf '%s\n' "$jobs_txt" | awk -F'|' 'NF{print "| "$1" | "$2" |"}'
            echo
            echo "[Full logs and artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/$RUN_ID)"
          } > body.md
          echo "ok=$ok"  >> "$GITHUB_OUTPUT"
          echo "bad=$bad" >> "$GITHUB_OUTPUT"
          cat body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open batch summary issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh issue create \
               --title "run: ${{ inputs.config }} · seeds ${{ inputs.seeds }} · ${{ steps.report.outputs.ok }} ok / ${{ steps.report.outputs.bad }} failed" \
               --body-file body.md \
               --assignee "${{ github.actor }}" \
               --label "training-run"; then
            echo "issue created"
          else
            echo "::warning::Could not create the summary issue; the report is on the run summary page."
          fi
